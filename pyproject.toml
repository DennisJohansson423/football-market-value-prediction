[project]
name = "football-market-value-prediction"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "shap>=0.46",
    "rapidfuzz>=3.9",
    "unidecode>=1.3",
    "jupyter>=1.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
